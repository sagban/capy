# Cloud Run service for the Capy MCP host (single container).
# Deploy with ./deploy.sh from the repo root.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __CAPY_SERVICE__
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 900
      containers:
        - image: gcr.io/__CAPY_GCP_PROJECT__/__CAPY_SERVICE__:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: CAPY_PROJECT_ID
              value: __CAPY_GCP_PROJECT__
            - name: GOOGLE_CLOUD_PROJECT
              value: __CAPY_GCP_PROJECT__
            - name: FIRESTORE_DATABASE_ID
              value: __FIRESTORE_DATABASE_ID__
            - name: GOOGLE_CLOUD_LOCATION
              value: __VERTEX_LOCATION__
            - name: VERTEX_GEMINI_MODEL
              value: __VERTEX_MODEL__
            - name: VERTEX_GEMINI_LIVE_MODEL
              value: __VERTEX_LIVE_MODEL__
            - name: API_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: API_ACCESS_TOKEN_SECRET
                  key: latest
            - name: USDA_FDC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: USDA_FDC_API_KEY
                  key: latest
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
