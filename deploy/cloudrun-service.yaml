# Cloud Run service for the Capy MCP host (single container).
# Deploy with ./deploy.sh from the repo root.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: SERVICE_NAME
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/SERVICE_NAME:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: CAPY_PROJECT_ID
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: FIRESTORE_DATABASE_ID
              value: DATABASE_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: VERTEX_LOCATION
            - name: VERTEX_GEMINI_MODEL
              value: VERTEX_MODEL
            - name: API_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: API_ACCESS_TOKEN_SECRET
                  key: latest
            - name: USDA_FDC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: USDA_FDC_API_KEY
                  key: latest
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
